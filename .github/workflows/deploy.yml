# Stage 07 — Deploy: build, test, deploy to Azure App Service via OIDC (no stored credentials).
# Skips cleanly until the repo variable AZURE_WEBAPP_NAME is set — see docs/SETUP.md.
name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - run: npm ci --omit=dev
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: |
            dist
            node_modules
            package.json
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: .
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "${{ steps.deploy.outputs.webapp-url }}/health" && exit 0
            sleep 10
          done
          exit 1
