# Stage 04 — Review: AI code review on every PR, plus @claude mentions in comments.
name: Claude code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  review:
    name: Claude review
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft
        && github.event.pull_request.head.repo.full_name == github.repository
        && github.actor != 'dependabot[bot]') ||
      (github.event_name != 'pull_request' && contains(github.event.comment.body, '@claude')
        && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    steps:
      - name: Require ANTHROPIC_API_KEY
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set, so no review ran. See docs/SETUP.md section 2."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            ${{ github.event_name == 'pull_request' && format('Review PR number {0} in {1}. Read CLAUDE.md, NON-NEGOTIABLES.md and SPEC.md first. Report only real bugs, security issues, missing tests and violations of NON-NEGOTIABLES.md as inline comments; skip style nits the linter already covers. Finish with a one-paragraph summary comment.', github.event.pull_request.number, github.repository) || '' }}
          claude_args: --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),Read,Grep,Glob"
